services:
  ctf-platform:
    build: .
    container_name: ctf-platform
    ports:
      - "8080:8080"
    volumes:
      - ctf-data:/app/database
      - ctf-uploads:/app/uploads
      - ctf-exports:/app/exports
    environment:
      - NODE_ENV=production
      - PORT=8080
    restart: unless-stopped

volumes:
  ctf-data:
  ctf-uploads:
  ctf-exports:
